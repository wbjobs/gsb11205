<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRDT 协同白板</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="toolbar">
    <div class="group" id="colors"></div>
    <div class="sep"></div>
    <div class="group" id="sizes"></div>
    <div class="sep"></div>
    <div class="group" id="layers"></div>
    <div class="sep"></div>
    <div class="group">
      <button id="undo" title="撤销自己最后一笔">撤销</button>
      <button id="clear" title="清空当前图层（所有标签页生效）">清层</button>
      <button id="export" title="导出 PNG">导出</button>
      <button id="stress" title="生成 10000 笔迹压测">压测</button>
    </div>
  </header>
  <canvas id="board"></canvas>
  <footer id="statusbar"><span id="status">启动中…</span></footer>
  <script type="module" src="js/main.js"></script>
</body>
</html>
